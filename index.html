<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Рейтинг калькуляторы</title>
  <style>
    :root {
      --primary: #34d399;
      --bg: #121816;
      --card-border: rgba(255, 255, 255, 0.09);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 0%, #1e3a34 0%, #111a17 60%, #080c0a 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 14px;
      overflow-x: hidden;
    }

    .card {
      background: rgba(20, 30, 26, 0.78);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 100%;
      max-width: 420px;
      padding: 22px 20px;
      border-radius: 32px;
      border: 1px solid var(--card-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.4px;
      background: linear-gradient(135deg, #ffffff 0%, #a7f3d0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.4;
    }

    /* Академиялық периодтар табтары */
    .periods-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      background: rgba(0, 0, 0, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 18px;
      padding: 5px;
      margin-bottom: 12px;
    }

    .periods-bar::-webkit-scrollbar {
      display: none;
    }

    .period-tab {
      flex: none;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      border-radius: 13px;
      padding: 7px 12px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .period-tab.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.28) 0%, rgba(52, 211, 153, 0.14) 100%);
      border-color: rgba(52, 211, 153, 0.45);
      color: #fff;
      box-shadow: 0 2px 10px rgba(16, 185, 129, 0.15);
    }

    .period-add {
      flex: none;
      background: transparent;
      border: 1px dashed rgba(52, 211, 153, 0.45);
      color: var(--primary);
      border-radius: 13px;
      padding: 7px 11px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .period-add:active {
      background: rgba(52, 211, 153, 0.12);
    }

    /* Белсенді период атауы мен жою батырмасы */
    .period-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .period-name-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0 12px;
      height: 40px;
      transition: border-color 0.25s;
    }

    .period-name-wrap:focus-within {
      border-color: var(--primary);
    }

    .period-badge-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--primary);
      letter-spacing: 0.4px;
      flex: none;
    }

    .period-name-input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    .period-remove-btn {
      height: 40px;
      padding: 0 12px;
      flex: none;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .period-remove-btn:active {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* Пән ауыстырғыш табтар */
    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      margin-bottom: 12px;
      padding-bottom: 2px;
    }

    .tabs-bar::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: none;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      border-radius: 14px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .tab-btn.active {
      background: rgba(52, 211, 153, 0.16);
      border-color: rgba(52, 211, 153, 0.5);
      color: #fff;
    }

    .tab-add {
      flex: none;
      background: transparent;
      border: 1px dashed rgba(52, 211, 153, 0.5);
      color: var(--primary);
      border-radius: 14px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .tab-add:active {
      background: rgba(52, 211, 153, 0.12);
    }

    /* Subject block */
    .subject {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid var(--card-border);
      border-radius: 26px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .subj-head {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .name-input {
      flex: 1;
      min-width: 0;
      height: 46px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 0 14px;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.25s;
    }

    .name-input:focus {
      border-color: var(--primary);
    }

    .credit-box {
      flex: none;
      width: 82px;
      height: 46px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 6px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: border-color 0.25s;
    }

    .credit-box:focus-within {
      border-color: var(--primary);
    }

    .credit-box label {
      font-size: 9.5px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .credit-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    .remove-btn {
      width: 38px;
      height: 38px;
      flex: none;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .remove-btn:active {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    /* Inputs */
    .rk-row {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .input-box {
      flex: 1;
      min-width: 0;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 18px;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .input-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.18);
    }

    .input-box label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .input-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
    }

    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .input-box span {
      display: block;
      font-size: 10.5px;
      color: var(--primary);
      margin-top: 4px;
      font-weight: 500;
    }

    /* Subject Result */
    .result-glow-box {
      background: radial-gradient(100% 100% at 50% 0%, rgba(52, 211, 153, 0.16) 0%, rgba(0, 0, 0, 0) 100%);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 22px;
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.08);
    }

    .res-label {
      font-size: 11px;
      color: #6ee7b7;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.8px;
    }

    .score-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 8px 0 0;
    }

    .final-score {
      font-size: 40px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 18px rgba(52, 211, 153, 0.55);
      line-height: 1;
    }

    .badge-grade {
      background: #10b981;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
    }

    .badge-grade.fail {
      background: #ef4444;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .warning {
      display: none;
      padding: 9px 10px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 12px;
      color: #fca5a5;
      font-size: 11px;
      margin-top: 12px;
      text-align: center;
    }

    /* Info rows */
    .targets {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 14px;
      border-radius: 18px;
      font-size: 12.5px;
    }

    .targets div {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
      color: var(--text-muted);
    }

    .targets div:last-child {
      margin-bottom: 0;
    }

    .targets strong {
      color: #fff;
      text-align: right;
    }

    /* Bottom GPA (Период + Жалпы) + Reset Bar */
    .bottom-bar {
      display: flex;
      align-items: stretch;
      gap: 10px;
    }

    .gpa-card {
      flex: 1;
      min-width: 0;
      background: radial-gradient(100% 100% at 0% 50%, rgba(52, 211, 153, 0.15) 0%, rgba(255, 255, 255, 0.025) 100%);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .gpa-col {
      flex: 1;
      min-width: 0;
    }

    .gpa-col.total {
      text-align: right;
    }

    .gpa-divider {
      width: 1px;
      align-self: stretch;
      background: rgba(255, 255, 255, 0.1);
      flex: none;
    }

    .gpa-col .res-label {
      font-size: 10px;
      margin-bottom: 2px;
      letter-spacing: 0.5px;
    }

    .gpa-score {
      font-size: 23px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 14px rgba(52, 211, 153, 0.45);
      line-height: 1.05;
    }

    .gpa-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-action {
      flex: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      border-radius: 20px;
      padding: 0 15px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:active {
      background: rgba(52, 211, 153, 0.12);
      border-color: var(--primary);
    }

    @media (max-width: 375px) {
      .card { padding: 18px 14px; }
      .subject { padding: 14px 12px; }
      .rk-row { gap: 10px; }
      .input-box { padding: 11px 12px; }
      .gpa-score { font-size: 20px; }
      .btn-action { padding: 0 12px; font-size: 12.5px; }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Рейтинг калькуляторы</h1>
    <div class="subtitle">Қорытынды балл: ((РК1 + РК2) ÷ 2 × 0,6) + (Емтихан × 0,4)</div>

    <!-- Академиялық периодтар -->
    <div class="periods-bar" id="periodsBar"></div>

    <!-- Белсенді период атауы -->
    <div class="period-header">
      <div class="period-name-wrap">
        <span class="period-badge-tag">Период</span>
        <input class="period-name-input" id="periodNameInput" type="text" maxlength="30" aria-label="Академиялық период атауы" oninput="renameCurrentPeriod(this.value)">
      </div>
      <button class="period-remove-btn" id="removePeriodBtn" onclick="removeCurrentPeriod()">Өшіру</button>
    </div>

    <!-- Белсенді периодтағы пәндер табтары -->
    <div class="tabs-bar" id="tabsBar"></div>

    <!-- Белсенді пән картасы -->
    <div class="subject">
      <div class="subj-head">
        <input class="name-input" id="subjName" type="text" maxlength="40" aria-label="Пән атауы" oninput="handleFieldInput()">
        <div class="credit-box">
          <label for="subjCredit">Кредит</label>
          <input id="subjCredit" type="number" inputmode="decimal" min="1" max="20" step="any" oninput="handleFieldInput()">
        </div>
        <button class="remove-btn" id="removeSubjBtn" onclick="removeCurrentSubject()" aria-label="Пәнді өшіру">✕</button>
      </div>

      <div class="rk-row">
        <div class="input-box">
          <label for="subjRk1">РК1 (30%)</label>
          <input id="subjRk1" type="number" inputmode="decimal" min="0" max="100" placeholder="0.0" oninput="handleFieldInput()">
          <span id="rk1Part">Үлесі: 0.0</span>
        </div>
        <div class="input-box">
          <label for="subjRk2">РК2 (30%)</label>
          <input id="subjRk2" type="number" inputmode="decimal" min="0" max="100" placeholder="0.0" oninput="handleFieldInput()">
          <span id="rk2Part">Үлесі: 0.0</span>
        </div>
      </div>

      <div class="rk-row">
        <div class="input-box">
          <label for="subjExam">Емтихан (40%)</label>
          <input id="subjExam" type="number" inputmode="decimal" min="0" max="100" placeholder="0.0" oninput="handleFieldInput()">
          <span id="examPart">Үлесі: 0.0</span>
        </div>
        <div class="input-box">
          <label for="subjTarget">Мақсатты балл</label>
          <input id="subjTarget" type="number" inputmode="decimal" min="0" max="100" placeholder="85" oninput="handleFieldInput()">
          <span>Қажетті меже</span>
        </div>
      </div>

      <div class="result-glow-box">
        <div class="res-label">Қорытынды балл</div>
        <div class="score-container">
          <div class="final-score" id="totalScore">0.0</div>
          <div class="badge-grade" id="gradeBadge">—</div>
        </div>
        <div class="warning" id="warningBox"></div>
      </div>

      <div class="targets">
        <div>
          <span>Рейтинг допуска (РД орташа):</span>
          <strong id="rdAvg">—</strong>
        </div>
        <div>
          <span>Мақсатқа қажетті емтихан:</span>
          <strong id="needTarget">—</strong>
        </div>
      </div>
    </div>

    <!-- Төменгі панель: Период GPA + Жалпы GPA + Тазарту -->
    <div class="bottom-bar">
      <div class="gpa-card">
        <div class="gpa-col">
          <div class="res-label">Период GPA</div>
          <div class="gpa-score" id="periodGpaValue">—</div>
          <div class="gpa-meta" id="periodGpaMeta">0/1 пән · 0 кр</div>
        </div>

        <div class="gpa-divider"></div>

        <div class="gpa-col total">
          <div class="res-label">Жалпы GPA</div>
          <div class="gpa-score" id="totalGpaValue">—</div>
          <div class="gpa-meta" id="totalGpaMeta">0/1 пән · 0 кр</div>
        </div>
      </div>

      <button class="btn-action" onclick="resetAll()">Тазарту</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "rating_calculator_v2";
    const LEGACY_STORAGE_KEY = "rating_calculator_v1";

    const GRADE_POINTS = {
      "A": 4.0, "A-": 3.67, "B+": 3.33, "B": 3.0, "B-": 2.67,
      "C+": 2.33, "C": 2.0, "C-": 1.67, "D+": 1.33, "D": 1.0, "F": 0
    };

    function createEmptySubject() {
      return { name: "", credit: "3", rk1: "", rk2: "", exam: "", target: "" };
    }

    function createEmptyPeriod() {
      return { name: "", activeSubjectIndex: 0, subjects: [createEmptySubject()] };
    }

    let state = {
      activePeriodIndex: 0,
      periods: [createEmptyPeriod()]
    };

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    function sanitizeSubject(s) {
      return {
        name: typeof s?.name === "string" ? s.name : "",
        credit: s?.credit !== undefined && s?.credit !== null ? String(s.credit) : "3",
        rk1: s?.rk1 !== undefined && s?.rk1 !== null ? String(s.rk1) : "",
        rk2: s?.rk2 !== undefined && s?.rk2 !== null ? String(s.rk2) : "",
        exam: s?.exam !== undefined && s?.exam !== null ? String(s.exam) : "",
        target: s?.target !== undefined && s?.target !== null ? String(s.target) : ""
      };
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.periods) && parsed.periods.length > 0) {
            state.periods = parsed.periods.map(p => {
              const subs = Array.isArray(p.subjects) && p.subjects.length > 0
                ? p.subjects.map(sanitizeSubject)
                : [createEmptySubject()];
              const idx = typeof p.activeSubjectIndex === "number"
                ? Math.max(0, Math.min(p.activeSubjectIndex, subs.length - 1))
                : 0;
              return {
                name: typeof p.name === "string" ? p.name : "",
                activeSubjectIndex: idx,
                subjects: subs
              };
            });
            state.activePeriodIndex = typeof parsed.activePeriodIndex === "number"
              ? Math.max(0, Math.min(parsed.activePeriodIndex, state.periods.length - 1))
              : 0;
            return true;
          }
        }

        // Алдыңғы нұсқадағы деректерді жоғалтпай көшіру
        const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
        if (legacyRaw) {
          const legacy = JSON.parse(legacyRaw);
          if (legacy && Array.isArray(legacy.subjects) && legacy.subjects.length > 0) {
            const subs = legacy.subjects.map(sanitizeSubject);
            const idx = typeof legacy.activeIndex === "number"
              ? Math.max(0, Math.min(legacy.activeIndex, subs.length - 1))
              : 0;
            state = {
              activePeriodIndex: 0,
              periods: [{ name: "", activeSubjectIndex: idx, subjects: subs }]
            };
            saveData();
            return true;
          }
        }
      } catch (e) {}
      return false;
    }

    function getCurrentPeriod() {
      return state.periods[state.activePeriodIndex];
    }

    function getCurrentSubject() {
      const p = getCurrentPeriod();
      return p.subjects[p.activeSubjectIndex];
    }

    function getLetterGrade(score, exam) {
      if (exam < 50) return { letter: "F", fail: true };
      const rounded = Math.round(score + 1e-9);
      if (rounded >= 95) return { letter: "A", fail: false };
      if (rounded >= 90) return { letter: "A-", fail: false };
      if (rounded >= 85) return { letter: "B+", fail: false };
      if (rounded >= 80) return { letter: "B", fail: false };
      if (rounded >= 75) return { letter: "B-", fail: false };
      if (rounded >= 70) return { letter: "C+", fail: false };
      if (rounded >= 65) return { letter: "C", fail: false };
      if (rounded >= 60) return { letter: "C-", fail: false };
      if (rounded >= 55) return { letter: "D+", fail: false };
      if (rounded >= 50) return { letter: "D", fail: false };
      return { letter: "F", fail: true };
    }

    function calcNeededExam(semAvg, target) {
      const needed = (target - semAvg * 0.6) / 0.4;
      if (needed <= 50) return "кемінде 50 балл";
      if (needed > 100) return "мүмкін емес";
      return Math.ceil(needed - 1e-9) + " балл";
    }

    function evaluateSubject(subj) {
      const rk1In = subj.rk1.trim();
      const rk2In = subj.rk2.trim();
      const exIn = subj.exam.trim();
      const tgIn = subj.target.trim();
      const crIn = subj.credit.trim();

      const rk1 = parseFloat(rk1In) || 0;
      const rk2 = parseFloat(rk2In) || 0;
      const exam = parseFloat(exIn) || 0;
      const target = parseFloat(tgIn);
      const credit = parseFloat(crIn);

      const semAvg = (rk1 + rk2) / 2;
      const rk1Weighted = rk1 * 0.3;
      const rk2Weighted = rk2 * 0.3;
      const examWeighted = exam * 0.4;
      const total = semAvg * 0.6 + examWeighted;

      const invalid = [rk1, rk2, exam].some(v => v < 0 || v > 100);
      const creditInvalid = crIn === "" || isNaN(credit) || credit <= 0;
      const notAdmitted = !invalid && rk1In !== "" && rk2In !== "" && semAvg < 50;
      const anyInput = rk1In !== "" || rk2In !== "" || exIn !== "";

      let warning = "";
      if (invalid) {
        warning = "Ескерту: Баға 0 мен 100 аралығында болуы керек.";
      } else if (creditInvalid) {
        warning = "Ескерту: GPA есептелуі үшін кредит санын енгізіңіз.";
      } else if (notAdmitted) {
        warning = "Рейтинг допуска (РД) 50-ден төмен! Емтиханға рұқсат жоқ.";
      } else if (exIn !== "" && exam < 50) {
        warning = "Емтихан 50-ден кем. Студентке F (0.0) бағасы қойылады.";
      }

      let letter = "—";
      let fail = false;
      if (anyInput) {
        if (notAdmitted) {
          letter = "Рұқсат жоқ";
          fail = true;
        } else {
          const g = getLetterGrade(total, exIn === "" ? 50 : exam);
          letter = g.letter;
          fail = g.fail && exIn !== "";
        }
      }

      const rdOK = rk1In !== "" && rk2In !== "" && !invalid;
      let need = "—";
      if (rdOK && tgIn !== "" && !isNaN(target) && target >= 0 && target <= 100) {
        need = notAdmitted ? "рұқсат жоқ" : calcNeededExam(semAvg, target);
      }

      const complete = !invalid && !creditInvalid && rk1In !== "" && rk2In !== "" && (exIn !== "" || notAdmitted);
      const points = complete ? (notAdmitted ? 0 : GRADE_POINTS[letter]) : null;

      return {
        rk1Weighted,
        rk2Weighted,
        examWeighted,
        total,
        anyInput,
        letter,
        fail,
        warning,
        rdOK,
        semAvg,
        need,
        points,
        credit: !creditInvalid ? credit : 0
      };
    }

    function calcPeriodGpa(period) {
      let sumPoints = 0, sumCredits = 0, counted = 0;
      period.subjects.forEach(s => {
        const res = evaluateSubject(s);
        if (res.points !== null && res.credit > 0) {
          sumPoints += res.points * res.credit;
          sumCredits += res.credit;
          counted++;
        }
      });
      return {
        sumPoints,
        sumCredits,
        counted,
        totalSubjects: period.subjects.length,
        gpa: sumCredits > 0 ? (sumPoints / sumCredits).toFixed(2) : "—"
      };
    }

    function renderPeriodsBar() {
      const bar = document.getElementById("periodsBar");
      bar.innerHTML = "";

      state.periods.forEach((p, i) => {
        const title = p.name.trim() || ((i + 1) + "-период");
        const pStats = calcPeriodGpa(p);
        const btn = document.createElement("button");
        btn.className = "period-tab" + (i === state.activePeriodIndex ? " active" : "");
        btn.textContent = pStats.gpa !== "—" ? `${title} · ${pStats.gpa}` : title;
        btn.onclick = () => selectPeriod(i);
        bar.appendChild(btn);
      });

      const addBtn = document.createElement("button");
      addBtn.className = "period-add";
      addBtn.textContent = "+ Период";
      addBtn.onclick = addPeriod;
      bar.appendChild(addBtn);

      const activeBtn = bar.querySelector(".period-tab.active");
      if (activeBtn) activeBtn.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    }

    function renderSubjectsBar() {
      const period = getCurrentPeriod();
      const bar = document.getElementById("tabsBar");
      bar.innerHTML = "";

      period.subjects.forEach((s, i) => {
        const name = s.name.trim() || ("Пән " + (i + 1));
        const res = evaluateSubject(s);
        const btn = document.createElement("button");
        btn.className = "tab-btn" + (i === period.activeSubjectIndex ? " active" : "");
        btn.textContent = res.letter !== "—" ? `${name} · ${res.letter}` : name;
        btn.onclick = () => selectSubject(i);
        bar.appendChild(btn);
      });

      const addBtn = document.createElement("button");
      addBtn.className = "tab-add";
      addBtn.textContent = "+ Пән қосу";
      addBtn.onclick = () => addSubject(true);
      bar.appendChild(addBtn);

      const activeTab = bar.querySelector(".tab-btn.active");
      if (activeTab) activeTab.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
    }

    function populateForm() {
      const period = getCurrentPeriod();
      const subj = getCurrentSubject();

      const periodInput = document.getElementById("periodNameInput");
      periodInput.value = period.name;
      periodInput.placeholder = (state.activePeriodIndex + 1) + "-период";
      document.getElementById("removePeriodBtn").style.display = state.periods.length > 1 ? "block" : "none";

      const subjNameInput = document.getElementById("subjName");
      subjNameInput.value = subj.name;
      subjNameInput.placeholder = "Пән " + (period.activeSubjectIndex + 1);
      document.getElementById("subjCredit").value = subj.credit;
      document.getElementById("subjRk1").value = subj.rk1;
      document.getElementById("subjRk2").value = subj.rk2;
      document.getElementById("subjExam").value = subj.exam;
      document.getElementById("subjTarget").value = subj.target;
      document.getElementById("removeSubjBtn").style.display = period.subjects.length > 1 ? "block" : "none";
    }

    function updateCalculations() {
      const subj = getCurrentSubject();
      const res = evaluateSubject(subj);

      document.getElementById("rk1Part").textContent = "Үлесі: " + res.rk1Weighted.toFixed(1);
      document.getElementById("rk2Part").textContent = "Үлесі: " + res.rk2Weighted.toFixed(1);
      document.getElementById("examPart").textContent = "Үлесі: " + res.examWeighted.toFixed(1);

      document.getElementById("totalScore").textContent = res.anyInput ? res.total.toFixed(1) : "0.0";

      const badge = document.getElementById("gradeBadge");
      badge.textContent = res.letter;
      badge.classList.toggle("fail", res.fail);

      const warningBox = document.getElementById("warningBox");
      if (res.warning) {
        warningBox.style.display = "block";
        warningBox.textContent = res.warning;
      } else {
        warningBox.style.display = "none";
      }

      document.getElementById("rdAvg").textContent = res.rdOK ? res.semAvg.toFixed(1) + " балл" : "—";
      document.getElementById("needTarget").textContent = res.need;

      // Период GPA
      const periodStats = calcPeriodGpa(getCurrentPeriod());
      document.getElementById("periodGpaValue").textContent = periodStats.gpa;
      document.getElementById("periodGpaMeta").textContent =
        `${periodStats.counted}/${periodStats.totalSubjects} пән · ${periodStats.sumCredits} кр`;

      // Барлық периодтар бойынша Жалпы GPA (CGPA)
      let allPoints = 0, allCredits = 0, allCounted = 0, allSubjects = 0;
      state.periods.forEach(p => {
        const ps = calcPeriodGpa(p);
        allPoints += ps.sumPoints;
        allCredits += ps.sumCredits;
        allCounted += ps.counted;
        allSubjects += ps.totalSubjects;
      });

      document.getElementById("totalGpaValue").textContent =
        allCredits > 0 ? (allPoints / allCredits).toFixed(2) : "—";
      document.getElementById("totalGpaMeta").textContent =
        `${allCounted}/${allSubjects} пән · ${allCredits} кр`;

      renderPeriodsBar();
      renderSubjectsBar();
    }

    function renderAll() {
      populateForm();
      updateCalculations();
    }

    function handleFieldInput() {
      const subj = getCurrentSubject();
      subj.name = document.getElementById("subjName").value;
      subj.credit = document.getElementById("subjCredit").value;
      subj.rk1 = document.getElementById("subjRk1").value;
      subj.rk2 = document.getElementById("subjRk2").value;
      subj.exam = document.getElementById("subjExam").value;
      subj.target = document.getElementById("subjTarget").value;

      updateCalculations();
      saveData();
    }

    function selectPeriod(index) {
      state.activePeriodIndex = Math.max(0, Math.min(index, state.periods.length - 1));
      renderAll();
      saveData();
    }

    function addPeriod() {
      state.periods.push(createEmptyPeriod());
      state.activePeriodIndex = state.periods.length - 1;
      renderAll();
      saveData();
      document.getElementById("periodNameInput").focus();
    }

    function renameCurrentPeriod(val) {
      getCurrentPeriod().name = val;
      renderPeriodsBar();
      saveData();
    }

    function removeCurrentPeriod() {
      if (state.periods.length <= 1) return;
      const title = getCurrentPeriod().name.trim() || ((state.activePeriodIndex + 1) + "-период");
      if (!confirm(`«${title}» және ондағы барлық пәндер өшіріледі. Жалғастырасың ба?`)) return;
      state.periods.splice(state.activePeriodIndex, 1);
      state.activePeriodIndex = Math.min(state.activePeriodIndex, state.periods.length - 1);
      renderAll();
      saveData();
    }

    function selectSubject(index) {
      const period = getCurrentPeriod();
      period.activeSubjectIndex = Math.max(0, Math.min(index, period.subjects.length - 1));
      renderAll();
      saveData();
    }

    function addSubject(focus) {
      const period = getCurrentPeriod();
      period.subjects.push(createEmptySubject());
      period.activeSubjectIndex = period.subjects.length - 1;
      renderAll();
      saveData();
      if (focus) document.getElementById("subjName").focus();
    }

    function removeCurrentSubject() {
      const period = getCurrentPeriod();
      if (period.subjects.length <= 1) return;
      period.subjects.splice(period.activeSubjectIndex, 1);
      period.activeSubjectIndex = Math.min(period.activeSubjectIndex, period.subjects.length - 1);
      renderAll();
      saveData();
    }

    function resetAll() {
      const hasMultiple = state.periods.length > 1 || state.periods[0].subjects.length > 1;
      if (hasMultiple && !confirm("Барлық академиялық периодтар мен пәндер тазаланады. Жалғастырасың ба?")) return;
      try {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(LEGACY_STORAGE_KEY);
      } catch (e) {}
      state = {
        activePeriodIndex: 0,
        periods: [createEmptyPeriod()]
      };
      renderAll();
    }

    loadData();
    renderAll();
  </script>

</body>
</html>
